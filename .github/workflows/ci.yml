name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # Publishing a release on GitHub builds the app and attaches the .dmg/.zip to it.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          sw_vers

      - name: Build
        run: swift build

      - name: Unit tests
        run: |
          # `run` steps use `bash -e` without pipefail, so take swift test's status explicitly:
          # a failing (or non-compiling) test target must fail the build.
          set +e
          swift test 2>&1 | tee "$RUNNER_TEMP/test.log"
          status=${PIPESTATUS[0]}
          set -e
          # Surface the result as annotations (readable through the API without log access).
          grep -E "Executed [0-9]+ tests" "$RUNNER_TEMP/test.log" | tail -1 | sed 's/^/::notice title=Unit tests::/' || true
          grep -E "error:|: error|failed \\(" "$RUNNER_TEMP/test.log" | sort -u | head -20 | sed 's/^/::error title=Unit tests::/' || true
          grep -iE "skipped" "$RUNNER_TEMP/test.log" | sort -u | head -8 | sed 's/^/::warning title=Tests::/' || true
          exit "$status"

      - name: End-to-end conversion with Apple's Dictionary Development Kit
        run: |
          swift build -c release --product dictbridge
          BIN="$(swift build -c release --show-bin-path)"
          "$BIN/dictbridge" ddk --download
          mkdir -p "$RUNNER_TEMP/e2e"
          cp Tests/MDictKitTests/Fixtures/basic.mdx Tests/MDictKitTests/Fixtures/basic.mdd "$RUNNER_TEMP/e2e/"
          printf '.entry{color:#333}\nEN{display:block}\n' > "$RUNNER_TEMP/e2e/basic.css"
          "$BIN/dictbridge" info "$RUNNER_TEMP/e2e/basic.mdx"
          "$BIN/dictbridge" convert "$RUNNER_TEMP/e2e/basic.mdx" --name "DictBridge CI" \
              --no-install --output "$RUNNER_TEMP/e2e" --keep-work 2>&1 | tee "$RUNNER_TEMP/e2e.log"
          grep -E "✓|cross-references|Saved|warning" "$RUNNER_TEMP/e2e.log" | head -6 | sed 's/^ */::notice title=End-to-end::/'
          D="$RUNNER_TEMP/e2e/basic.dictionary"
          test -s "$D/Contents/Resources/Body.data"
          test -s "$D/Contents/Resources/KeyText.index"
          test -f "$D/Contents/Resources/img/spk.png"
          test -f "$D/Contents/Resources/snd/apple.mp3"
          plutil -p "$D/Contents/Info.plist"
          echo "--- DefaultStyle.css"; cat "$D/Contents/Resources/DefaultStyle.css"
          # Validate the generated source XML that was kept with --keep-work.
          XML="$(ls -t "$HOME"/Library/Caches/DictBridge/build-*/dict.xml | head -1)"
          xmllint --noout "$XML"
          echo "--- dict.xml"; head -c 4000 "$XML"
          # Show one converted entry as an annotation (first 900 characters).
          grep -m1 'd:title="apple"' "$XML" | cut -c1-900 | sed 's/^/::notice title=apple entry::/'

      - name: Package DictBridge.app
        run: |
          # Release builds take their version from the tag (v0.2.0 -> 0.2.0).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          scripts/build-app.sh

      - name: Smoke-test the packaged CLI
        run: dist/DictBridge.app/Contents/Resources/dictbridge --version

      - uses: actions/upload-artifact@v4
        with:
          name: DictBridge
          path: |
            dist/*.zip
            dist/*.dmg

      - name: Attach to release
        if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
          generate_release_notes: ${{ github.event_name != 'release' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
